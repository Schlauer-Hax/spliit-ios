name: Android APK

on:
  push:
    branches: [skip-integration-plan]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo '::error::ANDROID_KEYSTORE_BASE64 is missing'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spliit-release.keystore"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: skiptools/actions/setup-skip@v1
        with:
          gradle-version: '9.4.1'
          install-swift-android-sdk: 'true'
          swift-android-sdk-version: '6.4.0'

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo '::error::ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          SKIP_EXPORT_ARCHS=aarch64 gradle -p Android :app:assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/spliit-release.keystore" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            '-Pandroid.injected.signing.key.alias=spliit' \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEYSTORE_PASSWORD"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spliit-arm64-release
          path: .build/Android/app/outputs/apk/release/app-release.apk
          include-hidden-files: true
          if-no-files-found: error
